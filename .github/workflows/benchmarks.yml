name: Benchmarks

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

concurrency:
  group: benchmarks-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

permissions:
  contents: read

env:
  UV_EXTRA_INDEX_URL: "https://download.pytorch.org/whl/cpu"
  UV_INDEX_STRATEGY: "unsafe-first-match"

jobs:
  full-benchmarks:
    name: Full benchmark baseline
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.8.17"
          enable-cache: true
          cache-dependency-glob: |
            pyproject.toml
            uv.lock

      - name: Install benchmark dependencies
        run: uv sync --frozen --no-default-groups --group ci-test

      - name: Run full benchmark suite
        run: |
          uv run --no-sync pytest \
            tests/benchmarks/ \
            --benchmark-only \
            --benchmark-disable-gc \
            --benchmark-warmup=on \
            --benchmark-json=benchmark-baseline.json

      - name: Upload benchmark baseline
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: benchmark-baseline-${{ github.run_id }}
          path: benchmark-baseline.json
          if-no-files-found: error
          retention-days: 90
